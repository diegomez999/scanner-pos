<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner POS</title>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:15px;
}

#reader{
width:100%;
max-width:500px;
margin:auto;
}

#resultado{
margin-top:15px;
font-size:20px;
font-weight:bold;
min-height:60px;
word-break:break-word;
}

input{
width:90%;
max-width:500px;
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
margin-top:15px;
}

button{
margin-top:15px;
padding:14px 25px;
font-size:18px;
border:none;
border-radius:10px;
background:#00c9a7;
color:white;
cursor:pointer;
}

.ok{
color:#00ff88;
}

.error{
color:#ff5555;
}

.info{
color:#00c8ff;
}
</style>
</head>

<body>

<h1>Scanner POS</h1>

<p>Apuntá al código de barras</p>

<div id="reader"></div>

<div id="resultado">
Iniciando...
</div>

<input
id="manual"
type="text"
placeholder="Ingresar serial manualmente">

<br>

<button id="btnScan">
ESCANEAR
</button>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyrWrFdOFQEO3JsflGiOnjIvlFCLFBl9m2hdJ5E1ldM44koKEgr2zOS0c6Wq4FQPwIZ/exec";

const resultado = document.getElementById("resultado");
const manual = document.getElementById("manual");
const btnScan = document.getElementById("btnScan");

let ultimoSerial = "";

function beep(){

try{

const ctx =
new(window.AudioContext||window.webkitAudioContext)();

const osc = ctx.createOscillator();

osc.connect(ctx.destination);

osc.start();

osc.stop(ctx.currentTime+0.15);

}catch(e){}

}

async function guardarSerial(serial,tipo){

if(!serial) return;

if(serial===ultimoSerial) return;

ultimoSerial=serial;

resultado.className="info";
resultado.innerText="Enviando: "+serial;

try{

const r = await fetch(URL_SCRIPT,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
serial:serial,
tipo:tipo
})
});

const txt = await r.text();

if(txt.includes("OK")){

beep();

resultado.className="ok";
resultado.innerText="Guardado: "+serial;

}else{

resultado.className="error";
resultado.innerText=txt;

}

}catch(err){

resultado.className="error";
resultado.innerText="ERROR: "+err.message;

}

setTimeout(()=>{
ultimoSerial="";
},3000);

}

btnScan.addEventListener("click",()=>{

guardarSerial(
manual.value.trim(),
"MANUAL"
);

manual.value="";

});

manual.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){

btnScan.click();

}

});

const html5QrCode = new Html5Qrcode("reader");

Html5Qrcode.getCameras()
.then(cameras=>{

if(cameras.length){

html5QrCode.start(
cameras[0].id,
{
fps:10,
qrbox:250
},
(decodedText)=>{

guardarSerial(
decodedText.trim(),
"AUTO"
);

}
);

resultado.className="ok";
resultado.innerText="Scanner iniciado";

}

})
.catch(err=>{

resultado.className="error";
resultado.innerText=err;

});

</script>

</body>
</html>
