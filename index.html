<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner POS</title>

<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:15px;
}

h1{
margin-bottom:10px;
}

video{
width:100%;
max-width:500px;
border-radius:12px;
border:2px solid #444;
}

#resultado{
margin-top:15px;
font-size:22px;
font-weight:bold;
}

input{
width:90%;
max-width:500px;
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
margin-top:15px;
}

.ok{
color:#00ff88;
}

.error{
color:#ff5555;
}

button{
margin-top:15px;
padding:12px 20px;
border:none;
border-radius:10px;
background:#00b894;
color:white;
font-size:18px;
cursor:pointer;
}
</style>
</head>

<body>

<h1>Scanner POS</h1>

<p>Apuntá al código de barras</p>

<video id="video"></video>

<div id="resultado">
Esperando lectura...
</div>

<input
id="manual"
type="text"
placeholder="Ingresar serial manualmente y presionar ENTER">

<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyrWrFdOFQEO3JsflGiOnjIvlFCLFBl9m2hdJ5E1ldM44koKEgr2zOS0c6Wq4FQPwIZ/exec";

const video = document.getElementById("video");
const resultado = document.getElementById("resultado");
const manual = document.getElementById("manual");

let ultimoSerial = "";

function beep(){
const ctx = new (window.AudioContext || window.webkitAudioContext)();
const osc = ctx.createOscillator();
osc.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.15);
}

async function guardarSerial(serial){

if(!serial) return;

if(serial === ultimoSerial) return;

ultimoSerial = serial;

resultado.className="ok";
resultado.innerText="Guardando: " + serial;

try{

await fetch(URL_SCRIPT,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
serial:serial,
tipo:"AUTO"
})
});

beep();

resultado.className="ok";
resultado.innerText="Guardado: " + serial;

}catch(e){

resultado.className="error";
resultado.innerText="Error enviando";

}

setTimeout(()=>{
ultimoSerial="";
},3000);

}

async function iniciarScanner(){

const codeReader = new ZXing.BrowserMultiFormatReader();

const devices = await ZXing.BrowserCodeReader.listVideoInputDevices();

await codeReader.decodeFromVideoDevice(
devices[0]?.deviceId,
video,
(result,error)=>{

if(result){

guardarSerial(result.text.trim());

}

}
);

}

manual.addEventListener("keypress",(e)=>{

if(e.key==="Enter"){

guardarSerial(
manual.value.trim()
);

manual.value="";

}

});

iniciarScanner();

</script>

</body>
</html>
