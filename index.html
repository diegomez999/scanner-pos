<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner POS</title>

<script src="https://unpkg.com/@zxing/browser@latest"></script>

<style>

body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:15px;
}

h1{
margin-bottom:10px;
}

video{
width:100%;
max-width:500px;
border-radius:12px;
border:2px solid #444;
}

#resultado{
margin-top:15px;
font-size:20px;
font-weight:bold;
min-height:60px;
word-break:break-word;
}

input{
width:90%;
max-width:500px;
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
margin-top:15px;
}

button{
margin-top:15px;
padding:14px 25px;
font-size:18px;
border:none;
border-radius:10px;
background:#00c9a7;
color:white;
cursor:pointer;
}

.ok{
color:#00ff88;
}

.error{
color:#ff5555;
}

.info{
color:#00c8ff;
}

</style>
</head>

<body>

<h1>Scanner POS</h1>

<p>Apuntá al código de barras</p>

<video id="video" autoplay playsinline muted></video>

<div id="resultado">
Iniciando...
</div>

<input
id="manual"
type="text"
placeholder="Ingresar serial manualmente">

<br>

<button id="btnScan">
ESCANEAR
</button>

<script>

const URL_SCRIPT =
"https://script.google.com/macros/s/AKfycbyrWrFdOFQEO3JsflGiOnjIvlFCLFBl9m2hdJ5E1ldM44koKEgr2zOS0c6Wq4FQPwIZ/exec";

const video = document.getElementById("video");
const resultado = document.getElementById("resultado");
const manual = document.getElementById("manual");
const btnScan = document.getElementById("btnScan");

let ultimoSerial = "";
let scannerActivo = false;

function beep(){

try{

const ctx =
new (window.AudioContext || window.webkitAudioContext)();

const osc = ctx.createOscillator();

osc.connect(ctx.destination);

osc.start();

osc.stop(ctx.currentTime + 0.15);

}catch(e){}

}

async function guardarSerial(serial,tipo){

if(!serial) return;

if(serial===ultimoSerial) return;

ultimoSerial = serial;

resultado.className="info";
resultado.innerText="Enviando: " + serial;

try{

const r = await fetch(URL_SCRIPT,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
serial:serial,
tipo:tipo
})
});

const txt = await r.text();

if(txt.includes("OK")){

beep();

resultado.className="ok";
resultado.innerText="Guardado: " + serial;

}else{

resultado.className="error";
resultado.innerText=txt;

}

}catch(err){

resultado.className="error";
resultado.innerText="ERROR: " + err.message;

}

setTimeout(()=>{
ultimoSerial="";
},3000);

}

btnScan.addEventListener("click",()=>{

if(!manual.value.trim()){

resultado.className="error";
resultado.innerText="Ingresá un serial o apuntá un código";

return;

}

guardarSerial(
manual.value.trim(),
"MANUAL"
);

manual.value="";

});

manual.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){

btnScan.click();

}

});

async function iniciarCamara(){

try{

const stream =
await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment"
},
audio:false
});

video.srcObject = stream;

await video.play();

resultado.className="ok";
resultado.innerText="Cámara iniciada";

iniciarScanner();

}catch(err){

resultado.className="error";
resultado.innerText=
"Error cámara: " + err.message;

}

}

function iniciarScanner(){

if(scannerActivo) return;

scannerActivo = true;

const codeReader =
new ZXing.BrowserMultiFormatReader();

codeReader.decodeFromVideoElement(
video,
(result,err)=>{

if(result){

const codigo =
result.getText().trim();

resultado.className="info";
resultado.innerText=
"Detectado: " + codigo;

guardarSerial(
codigo,
"AUTO"
);

}

}
);

}

iniciarCamara();

</script>

</body>
</html>
