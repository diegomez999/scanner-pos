<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanner POS</title>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:15px;
}

video{
width:100%;
max-width:500px;
border-radius:12px;
border:2px solid #444;
}

#resultado{
margin-top:15px;
font-size:22px;
font-weight:bold;
word-break:break-word;
}

input{
width:90%;
max-width:500px;
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
margin-top:15px;
}

button{
margin-top:15px;
padding:12px 25px;
font-size:18px;
border:none;
border-radius:10px;
background:#00b894;
color:white;
}

.ok{
color:#00ff88;
}

.error{
color:#ff5555;
}
</style>
</head>

<body>

<h1>Scanner POS</h1>

<p>Prueba de cámara</p>

<video id="video" autoplay playsinline muted></video>

<div id="resultado">Iniciando...</div>

<input
id="manual"
type="text"
placeholder="Ingresar serial manualmente">

<br>

<button onclick="enviarManual()">
ESCANEAR
</button>

<script>

const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbyrWrFdOFQEO3JsflGiOnjIvlFCLFBl9m2hdJ5E1ldM44koKEgr2zOS0c6Wq4FQPwIZ/exec";

const video = document.getElementById("video");
const resultado = document.getElementById("resultado");
const manual = document.getElementById("manual");

async function iniciarCamara(){

try{

const stream = await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"environment"
},
audio:false
});

video.srcObject = stream;

resultado.className="ok";
resultado.innerText="Cámara iniciada";

}catch(err){

resultado.className="error";
resultado.innerText="Error cámara: " + err.message;

}

}

async function guardarSerial(serial){

if(!serial){
resultado.className="error";
resultado.innerText="Ingresá un serial";
return;
}

resultado.className="";
resultado.innerText="Enviando...";

try{

const respuesta = await fetch(URL_SCRIPT,{
method:"POST",
body:JSON.stringify({
serial:serial,
tipo:"MANUAL"
})
});

const texto = await respuesta.text();

resultado.className="ok";
resultado.innerText="Respuesta: " + texto;

}catch(error){

resultado.className="error";
resultado.innerText="ERROR: " + error.message;

}

}

function enviarManual(){

guardarSerial(
manual.value.trim()
);

}

manual.addEventListener("keydown",function(e){

if(e.key==="Enter"){
enviarManual();
}

});

iniciarCamara();

</script>

</body>
</html>
