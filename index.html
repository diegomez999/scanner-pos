```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Scanner POS</title>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
body{
background:#111;
color:white;
font-family:Arial,sans-serif;
text-align:center;
padding:15px;
}

#reader{
width:100%;
max-width:350px;
margin:auto;
}

#resultado{
margin-top:15px;
font-size:20px;
font-weight:bold;
min-height:80px;
word-break:break-word;
}

input{
width:90%;
max-width:500px;
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
margin-top:15px;
}

button{
margin-top:15px;
padding:14px 25px;
font-size:18px;
border:none;
border-radius:10px;
background:#00c9a7;
color:white;
cursor:pointer;
}

.ok{color:#00ff88;}
.error{color:#ff5555;}
.info{color:#00c8ff;}
</style>
</head>

<body>

<h1>Scanner POS</h1>

<p>Apuntá al código o serial</p>

<div id="reader"></div>

<div id="resultado">
Iniciando...
</div>

<input
id="manual"
type="text"
placeholder="Ingresar serial manualmente">

<br>

<button id="btnScan">
ESCANEAR
</button>

<script>

const resultado = document.getElementById("resultado");
const manual = document.getElementById("manual");
const btnScan = document.getElementById("btnScan");

let bloqueado = false;

function beep(){
try{
const ctx = new(window.AudioContext||window.webkitAudioContext)();
const osc = ctx.createOscillator();
osc.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime+0.15);
}catch(e){}
}

function identificar(serial){

const s = serial.toUpperCase().trim();

if(
(s.startsWith("V283") || s.startsWith("V255"))
&& s.length === 13
){
return "POS COMUN";
}

if(
(s.startsWith("V377") || s.startsWith("V390"))
&& s.length === 13
){
return "POS CHINO";
}

if(
s.startsWith("NMS212")
&& s.length === 17
){
return "IMIN";
}

return "NO IDENTIFICADO";
}

function mostrarResultado(serial){

const tipo = identificar(serial);

resultado.className =
tipo==="NO IDENTIFICADO"
? "error"
: "ok";

resultado.innerHTML =
"TIPO: " + tipo +
"<br><br>" +
"SERIAL: " + serial;

}

btnScan.addEventListener("click",()=>{

if(!manual.value.trim()) return;

mostrarResultado(
manual.value.trim()
);

manual.value="";

});

manual.addEventListener("keydown",(e)=>{

if(e.key==="Enter"){
btnScan.click();
}

});

const html5QrCode = new Html5Qrcode("reader");

html5QrCode.start(
{
facingMode:"environment"
},
{
fps:15,
qrbox:{width:220,height:220}
},
(decodedText)=>{

if(bloqueado) return;

bloqueado = true;

beep();

mostrarResultado(
decodedText.trim()
);

setTimeout(()=>{
bloqueado = false;
},5000);

},
()=>{}
)
.then(()=>{

resultado.className="ok";
resultado.innerText="Scanner iniciado";

})
.catch(err=>{

resultado.className="error";
resultado.innerText="Error scanner: " + err;

});

</script>

</body>
</html>
